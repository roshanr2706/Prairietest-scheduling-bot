{% extends "base.html" %}{% block title %}Logs{% endblock %}
{% block body %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Activity</h1>
  <span class="text-secondary small"><i class="bi bi-arrow-repeat me-1"></i>auto-refreshing · times shown in your local zone</span>
</div>
<div class="card shadow-sm">
  <div class="table-responsive">
    <table class="table table-sm table-hover align-middle mb-0">
      <thead class="table-light"><tr><th style="width:11rem">Time</th><th style="width:6rem">Level</th><th>Message</th></tr></thead>
      <tbody id="events-body">
        <tr><td colspan="3" class="text-center text-secondary py-4">Loading…</td></tr>
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
