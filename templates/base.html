<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Snipe Bot{% endblock %} · PrairieTest Snipe Bot</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="bg-body-tertiary">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/">
        <i class="bi bi-crosshair2 me-1 text-info"></i>PrairieTest <span class="text-info">Snipe Bot</span>
      </a>
      {% if request.session.get('user') %}
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="/"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="/logs"><i class="bi bi-list-ul me-1"></i>Logs</a></li>
          <li class="nav-item ms-lg-2">
            <a class="btn btn-outline-light btn-sm" href="/logout">
              <i class="bi bi-box-arrow-right me-1"></i>{{ request.session.get('user') }}
            </a>
          </li>
        </ul>
      </div>
      {% endif %}
    </div>
  </nav>
  <main class="container py-4">{% block body %}{% endblock %}</main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
