services:
  snipe:
    build: .
    ports:
      - "8000:8000"
    environment:
      - WEBHOOK_URL=${WEBHOOK_URL}
      - CWL_USERNAME=${CWL_USERNAME}
      - CWL_PASSWORD=${CWL_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
    volumes:
      - ./data:/app/data          # read-write: SQLite state + storageState.json + debug
    restart: unless-stopped
